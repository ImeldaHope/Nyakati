# Builds the production image when a version tag (v1.2.3) is pushed and publishes it to
# GitHub's container registry, tagged with the version and latest. The host only pulls it.
# SITE_URL and NEXT_PUBLIC_REPORT_URL are read at build time, so they are repository
# variables (Settings > Secrets and variables > Actions > Variables), not code.
name: image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_REPORT_URL=${{ vars.NEXT_PUBLIC_REPORT_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
